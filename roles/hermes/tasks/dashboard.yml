---
- name: Set auth username
  ansible.builtin.import_tasks: utils/set-env.yml
  vars:
    hermes_key: HERMES_DASHBOARD_BASIC_AUTH_USERNAME
    hermes_value: "{{ hermes_dashboard_username }}"

- name: Set auth password
  ansible.builtin.import_tasks: utils/set-env.yml
  vars:
    hermes_key: HERMES_DASHBOARD_BASIC_AUTH_PASSWORD
    hermes_value: "{{ hermes_dashboard_password }}"

- name: Set auth secret
  ansible.builtin.shell: |
    set -eo pipefail
    env_file={{ ansible_user_dir }}/.hermes/profiles/{{ hermes_profile }}/.env
    if grep -q '^HERMES_DASHBOARD_BASIC_AUTH_SECRET=' "$env_file"; then
      sed -i "s/^HERMES_DASHBOARD_BASIC_AUTH_SECRET=.*/HERMES_DASHBOARD_BASIC_AUTH_SECRET=$(openssl rand -hex 32)/" "$env_file"
    else
      echo "HERMES_DASHBOARD_BASIC_AUTH_SECRET=$(openssl rand -hex 32)" >> "$env_file"
    fi
  args:
    executable: /bin/bash
  changed_when: true
  no_log: true


# dashboard.basic_auth.username + password_hash in config.yaml
# hash with: python -c "from plugins.dashboard_auth.basic import hash_password; print(hash_password('your-password'))"

- name: Deploy service file
  become: true
  ansible.builtin.template:
    src: dashboard.service.j2
    dest: "/etc/systemd/system/hermes-dashboard.service"
    owner: root
    group: root
    mode: "0644"

- name: Ensure service is running
  timeout: 300 # Will build UI on first run
  ansible.builtin.systemd:
    service: "hermes-dashboard"
    state: restarted
    enabled: true
    daemon_reload: true
