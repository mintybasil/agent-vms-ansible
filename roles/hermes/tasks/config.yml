---
- name: Create/reset config
  ansible.builtin.command: "{{ hermes_profile }} setup --reset --non-interactive"
  register: reset_cfg
  changed_when: reset_cfg.rc == 0

- name: Set max turns
  import_tasks: utils/set-config.yml
  vars:
    hermes_key: "agent.max_turns"
    hermes_value: "{{ hermes_max_turns }}"

- name: Set sudo password
  import_tasks: utils/set-env.yml
  vars:
    hermes_key: "SUDO_PASSWORD"
    hermes_value: "\"\""

- name: Set config editor
  import_tasks: utils/set-env.yml
  vars:
    hermes_key: "EDITOR"
    hermes_value: "vim"