---
- name: Create /etc/apt/keyrings directory
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: '0755'
  become: yes

- name: Download GitHub CLI GPG keyring
  ansible.builtin.get_url:
    url: https://cli.github.com/packages/githubcli-archive-keyring.gpg
    dest: /etc/apt/keyrings/githubcli-archive-keyring.gpg
    mode: '0644'
  become: yes

- name: Add GitHub CLI apt repository
  ansible.builtin.apt_repository:
    repo: 'deb [arch={{ ansible_facts["architecture"] }} signed-by=/etc/apt/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main'
    filename: github-cli
    state: present
  become: yes

- name: Install GitHub CLI
  ansible.builtin.apt:
    name: gh
    state: present
    update_cache: yes
  become: yes

- name: Authenticate
  ansible.builtin.shell: 'echo "{{ gh_cli_pat }}" | gh auth login --with-token'
  no_log: true