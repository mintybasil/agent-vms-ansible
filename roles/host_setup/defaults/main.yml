---
# --- host_user (optional non-root admin user) ---
host_user_manage: false
host_user: admin
host_user_copy_root_authorized_keys: true

# --- nftables ---
vm_allowed_outbound_ports:
  - 443  # HTTPS
  - 41641 # Direct WireGuard (Tailscale)
  - 3478 # STUN for NAT traversal

# Per-VM network isolation. Each VM gets its own libvirt network with a
# dedicated bridge interface and /30 subnet. Inter-VM traffic is denied by
# default; explicit allows are listed in vm_interconnects.
vm_bridge_prefix: "vmbr"
vm_bridge_offset: 10
vm_subnet_base: 0

# Inter-VM allow rules. Each entry allows source VM to reach destination VM
# on a specific TCP port. VM names must match the `name` field in `vms`.
# Example:
#   vm_interconnects:
#     - from: agent-vm-1
#       to: agent-vm-2
#       port: 8080
vm_interconnects: []

# --- tailscale ---
tailscale_up_extra_args: ""

# --- promtail ---
promtail_version: "3.0.0"
promtail_arch: "amd64"
promtail_scrape_journal: true
promtail_positions_path: /var/lib/promtail/positions.yaml

# --- SSH hardening (used by ssh_hardening task file) ---
# PermitRootLogin: no, prohibit-password, or yes
ssh_permit_root_login: "no"
# PasswordAuthentication: no or yes
ssh_password_authentication: "no"
