---
- name: Install nftables
  ansible.builtin.apt:
    name: nftables
    state: present
    update_cache: true

- name: Flush legacy iptables rules
  ansible.builtin.command: "{{ item }}"
  loop:
    - iptables -F
    - iptables -t nat -F
    - iptables -t mangle -F
    - iptables -P INPUT ACCEPT
    - iptables -P FORWARD ACCEPT
    - iptables -P OUTPUT ACCEPT
  changed_when: false

- name: Enable IP forwarding
  ansible.posix.sysctl:
    name: net.ipv4.ip_forward
    value: "1"
    state: present
    reload: true

# Build vm_networks from the vms list so the nftables template can generate
# per-bridge rules. This mirrors the derivation in libvirt.yml.
- name: Initialize vm_networks for nftables
  ansible.builtin.set_fact:
    vm_networks: []

- name: Build per-VM network definitions for nftables
  ansible.builtin.set_fact:
    vm_networks: "{{ vm_networks + [_net] }}"
  vars:
    _idx: "{{ vm_networks | length }}"
    _net:
      name: "{{ vm.name }}-net"
      bridge: "{{ vm_bridge_prefix }}{{ '%02d' | format(vm_bridge_offset | int + _idx | int) }}"
      subnet_octet: "{{ vm_subnet_base | int + _idx | int }}"
      vm_ip: "{{ vm.ip }}"
  loop: "{{ vms }}"
  loop_control:
    loop_var: vm
    label: "{{ vm.name }}"

- name: Build list of all VM subnet CIDRs
  ansible.builtin.set_fact:
    vm_subnet_cidrs: >-
      {{
        vm_networks
        | map(attribute='subnet_octet')
        | map('regex_replace', '^(.+)$', '10.200.\1.0/30')
        | list
      }}

- name: Deploy nftables config
  ansible.builtin.template:
    src: nftables.conf.j2
    dest: /etc/nftables.conf
    owner: root
    group: root
    mode: "0640"
    validate: nft --check -f %s
  notify: Reload nftables

- name: Enable and start nftables
  ansible.builtin.systemd:
    name: nftables
    state: started
    enabled: true