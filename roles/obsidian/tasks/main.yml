---
- name: "Install obsidian-headless"
  community.general.npm:
    name: obsidian-headless
    global: true
  become: true

- name: "Ensure config dir exists"
  ansible.builtin.file:
    path: "~/.config/obsidian-headless"
    state: directory

- name: "Deploy auth key"
  ansible.builtin.copy:
    content: "{{ obsidian_token | trim }}"
    dest: "~/.config/obsidian-headless/auth_token"
    mode: '0600'
  no_log: true

- name: "Verify authentication"
  ansible.builtin.shell: "ob sync-list-remote"

- name: Create vault dir
  ansible.builtin.file:
    path: "{{ obsidian_vault_path }}"
    state: directory

- name: Connect remote vault
  ansible.builtin.command: "ob sync-setup --vault {{ obsidian_vault_id }} --path {{ obsidian_vault_path }} --password {{ obsidian_vault_password }}"

- name: Create systemd user unit directory
  ansible.builtin.file:
    path: "{{ ansible_facts['env']['HOME'] }}/.config/systemd/user"
    state: directory
    mode: "0755"

- name: Deploy obsidian-sync.service from template
  ansible.builtin.template:
    src: obsidian-sync.service.j2
    dest: "{{ ansible_facts['env']['HOME'] }}/.config/systemd/user/obsidian-sync.service"
    mode: "0644"

- name: Reload systemd user daemon
  ansible.builtin.systemd:
    name: "obsidian-sync"
    scope: user
    daemon_reload: true

- name: Enable lingering so user services survive logout
  become: true
  ansible.builtin.command:
    cmd: "loginctl enable-linger {{ ansible_user_id }}"
  changed_when: false

- name: Reload systemd user daemon
  ansible.builtin.systemd:
    name: "obsidian-sync"
    scope: user
    daemon_reload: true

- name: Enable and start obsidian-sync service
  ansible.builtin.systemd:
    name: "obsidian-sync"
    enabled: true
    state: started
    scope: user
    daemon_reload: true

- name: Show service status
  ansible.builtin.command:
    cmd: "systemctl --user status obsidian-sync"
  changed_when: false
  register: svc_status

- name: Print status
  ansible.builtin.debug:
    var: svc_status.stdout_lines
