all:
  hosts:
    agent-host:
      ansible_host: "" # IP or hostname of the KVM host
      ansible_user: "{{ host_user }}"
      host_user: "admin" # Host user, optionally created
      host_user_manage: false
      host_ssh_port: 6969 # Optional, port will be changed to this value
#     Promtail: push to Loki or HTTP endpoint.
      promtail_enabled: false
#     promtail_loki_url: ""
#     promtail_basic_auth_user: ""
#     promtail_basic_auth_password: ""
      # VM definitions used by playbooks/vm-deploy.yml
      # Each VM gets its own isolated libvirt network (<name>-net) with a
      # dedicated bridge (vmbrNN) and /30 subnet (10.200.N.0/30).
      # Inter-VM traffic is denied by default; use vm_interconnects to allow.
      vms:
        - name: "agent-vm-1"
          user: "debian"
          ip: "10.200.0.2"
          ssh_public_key: "ssh-ed25519 AAAA...replace-with-your-key"
          disk_size: "20G"
          memory_mib: 4096
          vcpus: 4
          network_iface: "enp1s0"
      # Inter-VM allow rules. Each entry allows source VM to reach
      # destination VM on a specific TCP port.
      # vm_interconnects:
      #   - from: agent-vm-1
      #     to: agent-vm-2
      #     port: 8080
  children:
    agent_vms:
      hosts:
        agent-vm-1:
          ansible_host: "" # (Optional) Tailscale IP or MagicDNS hostname
          ansible_user: "debian" # (Optional) Default user